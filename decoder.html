<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Smuggling — Decoder</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding: 36px 20px;
  background: #ffffff;
  color: #1f2328;
  max-width: 520px;
  margin: 0 auto;
  line-height: 1.5;
}
.header {
  margin-bottom: 20px;
  border-bottom: 1px solid #d0d7de;
  padding-bottom: 12px;
}
h2 {
  font-size: 17px;
  font-weight: 600;
  color: #1f2328;
  letter-spacing: -0.2px;
}
.ver {
  font-size: 12px;
  color: #656d76;
  margin-top: 3px;
}
.card {
  background: #f6f8fa;
  border: 1px solid #d0d7de;
  border-radius: 6px;
  overflow: hidden;
}
.form-table {
  border-collapse: collapse;
  width: 100%;
}
.form-table td {
  padding: 10px 14px;
  font-size: 13px;
  vertical-align: middle;
}
.form-table tr:not(:last-child) td {
  border-bottom: 1px solid #e7eaed;
}
.lbl {
  width: 90px;
  color: #24292f;
  font-weight: 500;
  user-select: none;
}
input[type=password] {
  font-family: inherit;
  font-size: 13px;
  width: 100%;
  padding: 6px 10px;
  border: 1px solid #d0d7de;
  border-radius: 4px;
  background: #ffffff;
  color: #1f2328;
}
input[type=password]:focus {
  outline: 2px solid #0969da;
  outline-offset: -1px;
  border-color: #0969da;
}
.actions-cell {
  background: #ffffff;
  padding: 12px 14px;
}
button {
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  padding: 6px 16px;
  cursor: pointer;
  background: #24292f;
  color: #ffffff;
  border: 1px solid #24292f;
  border-radius: 4px;
}
button:hover:not(:disabled) {
  background: #323842;
}
button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
progress {
  display: none;
  width: 100%;
  height: 6px;
  margin-top: 14px;
  accent-color: #24292f;
}
.st {
  font-size: 12px;
  color: #57606a;
  margin-top: 8px;
  min-height: 18px;
  font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
}
.note {
  font-size: 12px;
  color: #57606a;
  margin-top: 8px;
  line-height: 1.5;
}
</style>
</head>
<body>

<div class="header">
  <h2>File Smuggling — Decoder</h2>
  <div class="ver">Folder Extraction &bull; Negligible RAM Footprint &bull; Requires Chrome or Edge</div>
</div>

<div class="card">
  <table class="form-table">
    <tr>
      <td class="lbl">Password</td>
      <td><input type="password" id="pw" placeholder="Required if file was encrypted"></td>
    </tr>
    <tr>
      <td colspan="2" class="actions-cell">
        <button id="btn" onclick="run()">Open Folder &amp; Decode</button>
        <div class="note">
          Select the folder containing the <b>.part*.html</b> files.<br>
          Parts are read as text streams directly from disk without DOM rendering.<br>
          Reconstructed output will be saved into the same folder.
        </div>
      </td>
    </tr>
  </table>
</div>

<progress id="prog" max="100" value="0"></progress>
<div class="st" id="st"></div>

<script>
function fmtB(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB';}
function b64u8(b){const bin=atob(b),r=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)r[i]=bin.charCodeAt(i);return r;}
function st(m){document.getElementById('st').textContent=m;}
function pr(v){const p=document.getElementById('prog');p.style.display='block';p.value=v;}
function bz(v){document.getElementById('btn').disabled=v;}
function xM(h){try{const s='/*SM*/const M=',e=';/*EM*/';const si=h.indexOf(s)+s.length,ei=h.indexOf(e,si);if(si<s.length||ei<0)return null;return JSON.parse(h.substring(si,ei));}catch{return null;}}
function xC(h){try{const s='/*SD*/const C=[',e='];/*ED*/';const si=h.indexOf(s)+s.length-1,ei=h.indexOf(e,si)+1;if(si<s.length-1||ei<1)return null;return JSON.parse(h.substring(si,ei));}catch{return null;}}
async function dk(pw,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function run(){
  if(!('showDirectoryPicker' in window)){st('Requires Chrome or Edge.');return;}
  bz(true);pr(0);st('Pick the folder with part HTML files...');
  let dir;
  try{dir=await window.showDirectoryPicker({mode:'readwrite',startIn:'desktop'});}
  catch{st('Cancelled.');bz(false);return;}
  try{
    st('Scanning folder...');
    const parts=[];
    for await(const[name,handle]of dir.entries()){
      if(handle.kind!=='file')continue;
      const m=name.match(/\.part(\d+)\.html$/i);
      if(m)parts.push({name,handle,num:parseInt(m[1])});
    }
    parts.sort((a,b)=>a.num-b.num);
    if(!parts.length){st('No .part*.html files found in this folder.');bz(false);return;}
    st('Reading metadata...');
    const t0=await(await parts[0].handle.getFile()).text();
    const meta=xM(t0);
    if(!meta){st('Cannot read metadata — invalid part file.');bz(false);return;}
    const pw=document.getElementById('pw').value;
    if(meta.enc&&!pw){st('File is encrypted — enter the password first.');bz(false);return;}
    let key=null;
    if(meta.enc){st('Deriving key...');key=await dk(pw,b64u8(meta.salt));}
    st('Creating output: '+meta.origName+'...');
    const oh=await dir.getFileHandle(meta.origName,{create:true});
    const wr=await oh.createWritable();
    let done=0,est=0;
    try{
      for(let pi=0;pi<parts.length;pi++){
        st('Part '+(pi+1)+'/'+parts.length+': reading...');
        const txt=pi===0?t0:await(await parts[pi].handle.getFile()).text();
        const chunks=xC(txt);
        if(!chunks)throw new Error('Cannot read data from part '+(pi+1));
        if(!est)est=parts.length*chunks.length;
        for(let ci=0;ci<chunks.length;ci++){
          let d=b64u8(chunks[ci].d);
          if(meta.enc){
            try{d=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(chunks[ci].iv)},key,d));}
            catch{throw new Error('Decryption failed — wrong password or corrupted part '+(pi+1));}
          }
          for(let k=0;k<d.length;k+=65536)await wr.write(d.subarray(k,Math.min(k+65536,d.length)));
          chunks[ci]=null;done++;
          pr(Math.round((done/Math.max(est,done+1))*99));
          st('Part '+(pi+1)+'/'+parts.length+' — chunk '+(ci+1)+'/'+chunks.length);
          await new Promise(r=>setTimeout(r,0));
        }
      }
      await wr.close();
      pr(100);st('Done. Saved: '+meta.origName+' ('+fmtB(meta.totalSize)+')');
    }catch(e){try{await wr.abort();}catch(_){}throw e;}
  }catch(e){st('Error: '+e.message);console.error(e);}
  bz(false);
}
</script>
</body>
</html>
